<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <title>Family Tree</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='9' r='5' fill='%232f6fdb'/%3E%3Ccircle cx='8' cy='24' r='5' fill='%23159a7f'/%3E%3Ccircle cx='24' cy='24' r='5' fill='%238048d8'/%3E%3Cpath d='M16 14v4M8 19v-1h16v1' stroke='%23888' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before the page draws, to avoid a white flash in dark mode.
    try {
      const th = JSON.parse(localStorage.getItem('familytree.settings') || '{}').theme;
      if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th;
    } catch (e) {}
  </script>
  <!-- Version number on every app file: when it changes, browsers fetch the new files
       instead of a saved older copy. Bump APP VERSION (all "?v=" below) on every app change;
       bump-version.ps1 does it. The family data file is always fetched fresh anyway. -->
  <link rel="stylesheet" href="css/style.css?v=13">
  <script type="importmap">
  {
    "imports": {
      "./js/main.js": "./js/main.js?v=13",
      "./js/i18n.js": "./js/i18n.js?v=13",
      "./js/model.js": "./js/model.js?v=13",
      "./js/dates.js": "./js/dates.js?v=13",
      "./js/crypto.js": "./js/crypto.js?v=13",
      "./js/layout.js": "./js/layout.js?v=13",
      "./js/render.js": "./js/render.js?v=13",
      "./js/details.js": "./js/details.js?v=13",
      "./js/sample.js": "./js/sample.js?v=13"
    }
  }
  </script>
  <script type="module" src="js/main.js?v=13"></script>
</head>
<body>

<!-- Lock screen: shown until the family file is decrypted -->
<section id="lock" class="lock">
  <div class="lock-card">
    <div class="lock-top">
      <button type="button" class="theme-btn" id="lockTheme" data-i18n-title="theme">◐</button>
      <div class="seg small" data-ui-lang-seg>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ka">ქა</button>
        <button type="button" data-lang="fr">FR</button>
      </div>
    </div>
    <h1 data-i18n="appTitle"></h1>

    <!-- The only thing visitors need: type the family code and press Enter.
         (With a share link the code is already in the address and the tree opens by itself.) -->
    <form id="passForm" class="code-form">
      <input id="passInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
             enterkeyhint="go" data-i18n-placeholder="passphrase" required>
      <button class="primary" data-i18n="enter"></button>
    </form>
    <p id="passError" class="error" hidden></p>
    <p id="passBusy" class="muted" hidden data-i18n="unlocking"></p>

    <div class="lock-links">
      <button type="button" id="btnDemo" class="link-btn" data-i18n="loadDemo"></button>
      <!-- Setup, only while no family tree has been published yet -->
      <span id="ownerSetup" hidden>
        <button type="button" id="btnNew" class="link-btn" data-i18n="startNew"></button>
        <label class="link-btn">
          <input type="file" id="fileOpen" accept=".json,application/json" hidden>
          <span data-i18n="importFile"></span>
        </label>
      </span>
    </div>
  </div>
</section>

<!-- Main app -->
<div id="app" hidden>
  <header class="topbar">
    <button id="btnMenu" class="icon-btn" data-i18n-title="menu">☰</button>
    <h1 data-i18n="appTitle"></h1>
    <button type="button" class="theme-btn" id="topTheme" data-i18n-title="theme">◐</button>
    <span id="demoBadge" class="badge" hidden data-i18n="demoBanner"></span>
    <span id="dirtyBadge" class="badge warn" hidden data-i18n="unsaved"></span>
  </header>

  <aside id="sidebar">
    <section>
      <h2 data-i18n="perspective"></h2>
      <!-- Person: who we look from (highlighted). Tree starts from: one of their ancestors;
           the tree shows everyone descending from that ancestor, each with their partner. -->
      <label class="field"><span data-i18n="person"></span><select id="personSelect"></select></label>
      <label class="field"><span data-i18n="treeFrom"></span><select id="headSelect"></select></label>
    </section>

    <section>
      <h2 data-i18n="familyFilter"></h2>
      <select id="familySelect"></select>
      <div id="familyPanel" hidden>
        <button id="btnFamilyTree" class="primary wide" data-i18n="showFamilyTree"></button>
        <div id="familyMembers" class="chips"></div>
      </div>
    </section>

    <section>
      <h2 data-i18n="namesIn"></h2>
      <label class="toggle"><input type="checkbox" data-name-lang="en"><span data-i18n="langEn"></span></label>
      <label class="toggle"><input type="checkbox" data-name-lang="ka"><span data-i18n="langKa"></span></label>
      <label class="toggle"><input type="checkbox" data-name-lang="fr"><span data-i18n="langFr"></span></label>
    </section>

    <section>
      <h2 data-i18n="uiLanguage"></h2>
      <div class="seg" data-ui-lang-seg>
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="ka">ქართული</button>
        <button type="button" data-lang="fr">Français</button>
      </div>
      <h2 data-i18n="theme"></h2>
      <div class="seg" id="themeSeg">
        <button type="button" data-theme-opt="auto" data-i18n="themeAuto"></button>
        <button type="button" data-theme-opt="light" data-i18n="themeLight"></button>
        <button type="button" data-theme-opt="dark" data-i18n="themeDark"></button>
      </div>
    </section>

    <section>
      <h2 data-i18n="birthdays"></h2>
      <label class="toggle"><input type="checkbox" id="bdayDeceased"><span data-i18n="showDeceased"></span></label>
      <ol id="birthdayList" class="bday-list"></ol>
    </section>

    <section>
      <!-- Only shown when the tree was opened with an editor code (e.g. FauvilleEditor). -->
      <div id="editSection">
      <h2 data-i18n="editing"></h2>
      <label class="toggle"><input type="checkbox" id="editToggle"><span data-i18n="editMode"></span></label>
      <div id="editTools" class="stack" hidden>
        <button id="btnAdd" data-i18n="addPerson"></button>
        <button id="btnSave" class="primary" data-i18n="saveFile"></button>
        <p class="muted small" data-i18n="saveHint"></p>
        <!-- Rarely needed: the family codes are already set. -->
        <details class="advanced">
          <summary data-i18n="advanced"></summary>
          <div class="stack">
            <button id="btnKeys" data-i18n="accessKeys"></button>
            <button id="btnExport" data-i18n="exportJson"></button>
          </div>
        </details>
      </div>
      </div>
      <div class="stack">
        <button id="btnShare" data-i18n="copyLink"></button>
        <button id="btnLock" data-i18n="lock"></button>
      </div>
    </section>
  </aside>
  <div id="scrim" hidden></div>

  <main id="stage">
    <svg id="tree" xmlns="http://www.w3.org/2000/svg">
      <g id="viewport"><g id="edges"></g><g id="cards"></g></g>
    </svg>
    <div id="emptyHint" class="empty" hidden>
      <p data-i18n="emptyTree"></p>
      <button id="btnAddFirst" class="primary" data-i18n="addPerson"></button>
    </div>
    <div class="zoom">
      <button id="zoomIn" data-i18n-title="zoomIn">+</button>
      <button id="zoomOut" data-i18n-title="zoomOut">−</button>
      <button id="zoomFit" data-i18n-title="fit">⤢</button>
    </div>
  </main>

  <aside id="details" hidden></aside>
</div>

<!-- Access keys: each key opens the same tree -->
<dialog id="keysDialog">
  <h2 data-i18n="accessKeys"></h2>
  <p class="muted" data-i18n="keysHint"></p>
  <ul id="keyList" class="key-list"></ul>
  <form id="keyAddForm" class="key-add">
    <input id="keyLabel" maxlength="40" data-i18n-placeholder="keyLabelPh" autocomplete="off">
    <input id="keyValue" data-i18n-placeholder="keyValuePh" autocomplete="off" autocapitalize="off" spellcheck="false">
    <select id="keyRole">
      <option value="viewer" data-i18n="roleViewer"></option>
      <option value="editor" data-i18n="roleEditor"></option>
    </select>
    <button class="primary" data-i18n="addKey"></button>
  </form>
  <p id="keyError" class="error" hidden></p>
  <p class="muted small" data-i18n="keysWarning"></p>
  <div class="row end">
    <button type="button" id="keysDone" data-i18n="done"></button>
  </div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
